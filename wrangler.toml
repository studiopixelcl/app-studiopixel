# ==============================================================================
# Studio Pixel SpA - App Hub (app.studiopixel.cl)
# Configuración de despliegue para Cloudflare Pages / Workers + D1
# ==============================================================================

name = "sp-app-hub"
compatibility_date = "2024-04-01"
pages_build_output_dir = "./public"

# Variables de entorno públicas
[vars]
ENVIRONMENT = "production"
APP_NAME = "Studio Pixel App Hub"
COMPANY_NAME = "Studio Pixel SpA"
MAIN_DOMAIN = "studiopixel.cl"
APP_DOMAIN = "app.studiopixel.cl"

# Binding de Base de Datos Cloudflare D1 en Producción
[[d1_databases]]
binding = "sp_hub_db"
database_name = "sp_hub_db"
database_id = "a2de5b33-8061-419a-a250-be88c79d3b91"
migrations_dir = "migrations"
